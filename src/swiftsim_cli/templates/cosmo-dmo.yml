# swift-cli template: cosmological dark-matter-only (self-gravity) run.
# Derived from SWIFT's examples/EAGLE_DMO_low_z and SmallCosmoVolume_DM.
# Run with: swift --cosmology --self-gravity params.yml
# `swift-cli new` fills in the ICs, units, start time and softenings.

MetaData:
  run_name: swift-cli cosmological DMO run

InternalUnitSystem:
  UnitMass_in_cgs: 1.98841e43       # 10^10 M_sun
  UnitLength_in_cgs: 3.08567758e24  # 1 Mpc
  UnitVelocity_in_cgs: 1e5          # 1 km/s
  UnitCurrent_in_cgs: 1             # Amperes
  UnitTemp_in_cgs: 1                # Kelvin

Cosmology:                          # Planck13 (EAGLE)
  h: 0.6777
  a_begin: 0.0078125                # Set from the ICs
  a_end: 1.0
  Omega_cdm: 0.2587481
  Omega_lambda: 0.693
  Omega_b: 0.0482519

TimeIntegration:
  dt_min: 1e-10
  dt_max: 1e-2

Gravity:
  eta: 0.025
  MAC: adaptive
  theta_cr: 0.7
  epsilon_fmm: 0.001
  mesh_side_length: 128
  comoving_DM_softening: 0.0026994  # Set from the ICs
  max_physical_DM_softening: 0.0007 # Set from the ICs

Snapshots:
  basename: snap
  scale_factor_first: 0.0078125     # Set to a_begin
  delta_time: 1.1                   # Ratio of consecutive scale factors
  compression: 4

Statistics:
  scale_factor_first: 0.0078125     # Set to a_begin
  delta_time: 1.01

Scheduler:
  max_top_level_cells: 16
  cell_split_size: 200

Restarts:
  delta_hours: 6.0

InitialConditions:
  file_name: ics.hdf5               # Set by swift-cli new
  periodic: 1
  cleanup_h_factors: 0              # 1 for Gadget-style ICs in h^-1 units
  cleanup_velocity_factors: 0       # 1 for Gadget-style sqrt(a) velocities
