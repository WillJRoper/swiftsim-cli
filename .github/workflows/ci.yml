name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git tags.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --exclude="src/swiftsim_cli/_version.py"
          ruff format --check src/ tests/ --exclude="src/swiftsim_cli/_version.py"

      # Checks src and tests with the [tool.mypy] config in pyproject.toml,
      # the same invocation as the pre-commit hook.
      - name: Type check with mypy
        run: mypy

      - name: Test with pytest
        run: python -m pytest

      # Tokenless uploads work for public repositories; set a CODECOV_TOKEN
      # repository secret if uploads are rate limited. Never fails the build.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
