[project]
name = "swiftsim-cli"

# Dynamic version numbers from git
dynamic = ["version"]

# Tagline for SWIFTSim CLI
description = "A command-line toolkit for building, running and analysing SWIFT simulations."

# The long description shown on PyPI
readme = "README.md"

# Minimum Python version
requires-python = ">=3.10"

# The licence (SPDX expression, PEP 639)
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

# Project keywords
keywords =[
  "galaxy",
  "modelling",
  "smoothed particle hydrodynamics",
  "particles",
  "nbody",
  "galaxy formation",
  "theory",
  "sph",
  "cosmology",
  "galaxy evolution",
  "command line",
  "cli",
]

# SWIFTSim-CLI authors
authors = [
  {name = "W. J. Roper", email = "w.roper@sussex.ac.uk" },
]

# SWIFTSim-CLI maintainers
maintainers = [
  {name = "W. J. Roper", email = "w.roper@sussex.ac.uk" },
]

# Classifiers
classifiers = [  # Optional
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Topic :: Scientific/Engineering :: Astronomy",

  # Supported Python versions
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

# Dependencies
# (each is imported under src/swiftsim_cli, except scipy, which astropy
# needs for the cosmology integrals and z_at_value but does not install)
dependencies = [
  "astropy",               # cosmology conversions
  "scipy",                 # required by astropy.cosmology (see above)
  "h5py",                  # reading initial conditions in `new`
  "matplotlib >= 3.5",     # all analysis plots
  "numpy >= 1.23",
  "pandas >= 1.5",         # mpiuse report parsing
  "prompt_toolkit",        # interactive profile prompts
  "ruamel.yaml",           # round-trip parameter and profile files
  "swiftsimio",            # reading snapshots in `utils`
  "tqdm >= 4.60",          # progress bars in task plots
  # Parsing SWIFT's C source for timers. QueryCursor needs >= 0.25;
  # tree-sitter 0.26.0 segfaults in timer_db.parse_source on larger files
  # (reproduced with tests/data/swift_src/src/generated.c), so stay below it
  # until a fixed release has been tested.
  "tree-sitter >= 0.25, < 0.26",
  "tree-sitter-c >= 0.24",
]

# Optional dependencies for specific use cases
[project.optional-dependencies]
# Development
dev = [
    "ruff==0.11.7",
    "mypy>=1.10",  # the pre-commit mypy hook runs the installed mypy
    "pre-commit",
]

# Testing
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "coverage[toml]>=7.0",
    "ruff==0.11.7",
    "mypy>=1.10",
    "PyYAML",   # reading the expected-output fixtures
    "unyt",     # comes with swiftsimio; imported directly by a test
]

# Project urls
[project.urls]
"Homepage" = "https://github.com/WillJRoper/swiftsim-cli"
"Documentation" = "https://github.com/WillJRoper/swiftsim-cli#readme"
"Source" = "https://github.com/WillJRoper/swiftsim-cli"
"Bug Reports" = "https://github.com/WillJRoper/swiftsim-cli/issues"
"Changelog" = "https://github.com/WillJRoper/swiftsim-cli/blob/main/CHANGELOG.md"

# Entry points
[project.scripts]
swift-cli="swiftsim_cli.cli:main"

# Set up the build system
[build-system]

# setuptools>=77 for PEP 639 licence metadata, setuptools_scm for git
# versioning (pure Python, so nothing else is needed at build time)
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

# Make a version file at build time
version_file = "src/swiftsim_cli/_version.py"

# Configure the linter and formatter
[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    ".DS_Store",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".pre-commit-config.yaml",
    "*__init__.py"  # ignore all init files
]

# PEP-8 line length
line-length = 79
indent-width = 4


# Match requires-python
target-version = "py310"


[tool.ruff.lint]
select = ["F", "E", "W", "D"]
ignore = [
       "E402",  # "module level import not at top of file" (isolate C imports in case python alternatives exist)
       "F811",  # "redefinition of unused name from line N" (breaks quantity objects)
       ]


# Sort imports alphabetically
extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# For every .py under examples/, ignore all D-rules
"examples/**/*.py" = ["D"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


# Type checking. `mypy` with no arguments checks src and tests; CI and the
# pre-commit hook both run it this way so they agree.
[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = ["^src/swiftsim_cli/_version\\.py$"]
# astropy, h5py, swiftsimio and tree_sitter_c ship without type information.
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "swiftsim_cli.*"
disallow_untyped_defs = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src/swiftsim_cli",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/swiftsim_cli"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/test_*",
    "src/swiftsim_cli/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
