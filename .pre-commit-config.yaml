# This file contains the configuration for pre commit hooks used to sanitise the repository.
repos:
  # General pre-commit hooks to stop bad things happening.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict # Check for files that contain merge conflict strings.
      - id: check-case-conflict # Ensure we don't have case clashes in the repository.
      - id: check-added-large-files # Prevent large files from being added to the repository.

  # Linting and formatting for Python.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.7
    hooks:
      # Run the linter.
      - id: ruff
        args:
          - --fix
      # Run the formatter.
      - id: ruff-format

  # Type checking with mypy, using the [tool.mypy] config in pyproject.toml.
  # It runs the mypy from your dev environment (pip install -e ".[dev,test]")
  # so it sees the same third-party type information as CI. Only the staged
  # Python files are passed (mypy still follows their imports), so untracked
  # work-in-progress files can't break a commit; CI checks the whole tree.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        require_serial: true
